# Frontend CI (run from monorepo root when client/ is present)
# The Medifield git repo currently tracks the API (this server/).
# To also verify the React app in CI, either:
#   1. Move this workflow to a parent monorepo that contains client/ + server/, or
#   2. Mirror client into this repo under client/ and restore the frontend job.

name: Frontend Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: CI=true npm run build
